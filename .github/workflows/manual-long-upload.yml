# One-off upload for pre-built long videos (Quran recitation) to YouTube + Facebook.
# The MP4s are staged in the repo (staging/<video>/part_*.bin) because they exceed
# git's single-file limits; the workflow reassembles them.
# Trigger: workflow_dispatch with video choice.
# Uses the repo's working YT/FB secrets (local OAuth is revoked).
name: Manual long-video upload

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Which video to upload"
        required: true
        type: choice
        options:
          - 003-al-imran
          - 018-al-kahf
      skip_facebook:
        description: "Skip Facebook upload (already live there)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffprobe -version | head -1

      - name: Write SEO metadata
        run: |
          python3 - << 'PYEOF'
          import json, os
          video = os.environ["VIDEO"]
          META = {
            "003-al-imran": {
              "title": "Surah Al-Imran Full | Beautiful Quran Recitation | Mishary Rashid Alafasy | \u0633\u0648\u0631\u0629 \u0622\u0644 \u0639\u0645\u0631\u0627\u0646",
              "description": (
                "Surah Al-Imran \u2014 the third Surah of the Holy Quran (200 verses, Madani). \U0001F932\n\n"
                "Beautiful recitation by Mishary Rashid Alafasy, with big Arabic subtitles in one fixed\n"
                "position (2\u20133 ayahs at a time, replaced as a group \u2014 never stacked), plus Urdu and\n"
                "English translations with word-by-word gold highlighting.\n\n"
                "\u2728 Listen daily for peace of heart and mind.\n\n"
                "Reciter: Mishary Rashid Alafasy\n"
                "Surah: Aal-e-Imran (3) \u2022 200 verses \u2022 Madani\n\n"
                "Follow us everywhere \u2014 same name, same DP on all platforms:\n"
                "\U0001F4FA YouTube: https://www.youtube.com/@officialzikreilahi\n"
                "\U0001F4D8 Facebook: https://www.facebook.com/officialzikreilahi\n"
                "\U0001F4F8 Instagram: https://www.instagram.com/@officialzikreilahi\n"
                "\U0001F3B5 TikTok: https://www.tiktok.com/@officialzikreilahi\n\n"
                "New videos every day \u2014 one complete Surah in every video, plus Islamic stories. Subscribe! \U0001F514\n\n"
                "#SurahAlImran #QuranRecitation #MisharyRashidAlafasy #Tilawat #Quran #Islam #ZikreIlahi"
              ),
              "tags": ["surah al imran full", "surah al imran", "al imran",
                       "surah al imran mishary rashid alafasy", "mishary rashid alafasy",
                       "quran recitation", "quran tilawat", "tilawat e quran",
                       "beautiful quran recitation", "peaceful quran recitation",
                       "holy quran", "surah 3", "zikr e ilahi", "islamic videos", "quran"],
              "fb_caption": (
                "Surah Al-Imran Full (3) \u2014 Mishary Rashid Alafasy ki khoobsurat tilawat, "
                "badi Arabic subtitles + Urdu aur English tarjume ke saath. Rozana sunein, dil ko "
                "sukoon mile. \U0001F932 Follow us: YouTube/Facebook/Instagram/TikTok \u2014 @officialzikreilahi "
                "#SurahAlImran #QuranRecitation #Tilawat #ZikreIlahi"
              ),
            },
            "018-al-kahf": {
              "title": "Surah Al-Kahf Full | Beautiful Quran Recitation | Mishary Rashid Alafasy | \u0633\u0648\u0631\u0629 \u0627\u0644\u0643\u0647\u0641",
              "description": (
                "Surah Al-Kahf \u2014 the 18th Surah of the Holy Quran (110 verses, Makki). \U0001F932\n\n"
                "Beautiful recitation by Mishary Rashid Alafasy, with big Arabic subtitles in one fixed\n"
                "position (2\u20133 ayahs at a time, replaced as a group \u2014 never stacked), plus Urdu and\n"
                "English translations with word-by-word gold highlighting.\n\n"
                "\u2728 The Prophet \ufdfa said: whoever recites Surah Al-Kahf on Friday, light will shine for him "
                "until the next Friday. Listen daily for peace of heart and mind.\n\n"
                "Reciter: Mishary Rashid Alafasy\n"
                "Surah: Al-Kahf (18) \u2022 110 verses \u2022 Makki\n\n"
                "Follow us everywhere \u2014 same name, same DP on all platforms:\n"
                "\U0001F4FA YouTube: https://www.youtube.com/@officialzikreilahi\n"
                "\U0001F4D8 Facebook: https://www.facebook.com/officialzikreilahi\n"
                "\U0001F4F8 Instagram: https://www.instagram.com/@officialzikreilahi\n"
                "\U0001F3B5 TikTok: https://www.tiktok.com/@officialzikreilahi\n\n"
                "New videos every day \u2014 one complete Surah in every video, plus Islamic stories. Subscribe! \U0001F514\n\n"
                "#SurahAlKahf #QuranRecitation #MisharyRashidAlafasy #Tilawat #Quran #Islam #ZikreIlahi"
              ),
              "tags": ["surah al kahf full", "surah al kahf", "surah kahf",
                       "surah al kahf mishary rashid alafasy", "mishary rashid alafasy",
                       "quran recitation", "quran tilawat", "tilawat e quran",
                       "beautiful quran recitation", "peaceful quran recitation",
                       "jummah surah", "holy quran", "surah 18", "zikr e ilahi", "quran"],
              "fb_caption": (
                "Surah Al-Kahf Full (18) \u2014 Mishary Rashid Alafasy ki khoobsurat tilawat, "
                "badi Arabic subtitles + Urdu aur English tarjume ke saath. Jummah ke din Surah Kahf "
                "sunein \u2014 dil ko sukoon mile. \U0001F932 Follow us: YouTube/Facebook/Instagram/TikTok "
                "\u2014 @officialzikreilahi #SurahAlKahf #QuranRecitation #Tilawat #ZikreIlahi"
              ),
            },
          }
          m = META[video]
          json.dump({"seo": {"title": m["title"], "description": m["description"], "tags": m["tags"]}},
                    open("seo-long.json", "w", encoding="utf-8"), ensure_ascii=False)
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"FB_TITLE={m['title']}\n")
            f.write("FB_CAPTION<<EOF\n" + m["fb_caption"] + "\nEOF\n")
          print("SEO written for", video)
          PYEOF
        env:
          VIDEO: ${{ inputs.video }}

      - name: Reassemble MP4 from staged chunks
        run: |
          # chunks are already in the checkout (committed to main)
          STAGE="staging/${{ inputs.video }}"
          ls "$STAGE"/part_*.bin | wc -l
          cat "$STAGE"/part_*.bin > video.mp4
          ls -la video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of csv video.mp4

      - name: Publish GitHub Release (public URL for Facebook)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="long-${{ inputs.video }}-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" --title "Long video $TAG" \
            --notes "${{ inputs.video }}" video.mp4
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" >> $GITHUB_OUTPUT

      - name: Upload to YouTube (public)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/upload_youtube.py video.mp4 seo-long.json | tee yt_out.txt
          grep -o 'https://www.youtube.com/watch?v=[^ ]*' yt_out.txt | head -1

      - name: Upload to Facebook Page (video)
        if: ${{ !inputs.skip_facebook }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          VIDEO_URL: ${{ steps.release.outputs.url }}
        run: |
          set -o pipefail
          python3 scripts/upload_facebook.py --file-url "$VIDEO_URL" \
            --title "$FB_TITLE" --description "$FB_CAPTION" | tee fb_out.txt
          grep -q 'PUBLISHED:' fb_out.txt

      - name: Record upload URLs
        run: |
          YT_URL=$(grep -o 'https://www.youtube.com/watch?v=[^ ]*' yt_out.txt | head -1)
          FB_ID=""
          if [ -f fb_out.txt ]; then FB_ID=$(grep -oP 'PUBLISHED:\s*\K[0-9]+' fb_out.txt | head -1) || true; fi
          echo "## ${{ inputs.video }} — $(date -u +%F_%T_UTC)" >> upload-log.md
          echo "- YouTube: $YT_URL" >> upload-log.md
          echo "- Facebook video ID: $FB_ID" >> upload-log.md
          echo "" >> upload-log.md
          git config user.name "autopilot" && git config user.email "autopilot@local"
          git add upload-log.md && git commit -m "log: ${{ inputs.video }} upload URLs" && git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
